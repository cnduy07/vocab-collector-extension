<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vocabulary Collector</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 340px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1f2937;
        background: #ffffff;
      }
      header {
        padding: 14px 16px 10px;
        border-bottom: 1px solid #e5e7eb;
      }
      h1 {
        font-size: 14px;
        font-weight: 700;
        margin: 0 0 4px;
      }
      .note {
        font-size: 11px;
        color: #9ca3af;
        margin: 0;
        line-height: 1.4;
      }
      #list {
        max-height: 280px;
        overflow-y: auto;
        padding: 4px 0;
      }
      .item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
        gap: 8px;
        padding: 8px 16px;
        border-bottom: 1px solid #f3f4f6;
        font-size: 13px;
      }
      .item strong { font-weight: 600; }
      .item-head {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .speak-item {
        width: 20px;
        height: 20px;
        flex: none;
        padding: 3px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: #9ca3af;
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .speak-item svg { width: 100%; height: 100%; }
      .speak-item:hover { background: #f3f4f6; color: #374151; }
      .speak-item.is-busy { color: #c98a2c; animation: pulse 900ms ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) { .speak-item.is-busy { animation: none; } }
      .item-main {
        min-width: 0;
      }
      .item-meta {
        margin-top: 3px;
        font-size: 11px;
        color: #6b7280;
        line-height: 1.35;
      }
      .item-meta a {
        color: #2563eb;
        text-decoration: none;
      }
      .item-meta a:hover {
        text-decoration: underline;
      }
      .item .date {
        display: block;
        margin-bottom: 6px;
        font-size: 10px;
        color: #9ca3af;
        white-space: nowrap;
      }
      .item-actions {
        text-align: right;
      }
      .delete-item {
        width: auto;
        padding: 4px 8px;
        color: #b91c1c;
      }
      .delete-item:hover {
        background: #fef2f2;
      }
      .sync-ok { color: #047857; }
      .sync-warn { color: #b45309; }
      .empty {
        padding: 20px 16px;
        font-size: 12px;
        color: #9ca3af;
        text-align: center;
      }
      footer {
        display: grid;
        gap: 8px;
        padding: 10px 16px;
        border-top: 1px solid #e5e7eb;
      }
      .footer-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .footer-row.three {
        grid-template-columns: 1fr 1fr 1fr;
      }
      #status {
        min-height: 14px;
        font-size: 11px;
        color: #6b7280;
        line-height: 1.35;
      }
      #status.error {
        color: #b91c1c;
      }
      button {
        width: 100%;
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        color: #6b7280;
        border-radius: 8px;
        padding: 6px 0;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover { background: #f3f4f6; }
      button:focus-visible { outline: 2px solid #c98a2c; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Vocabulary Collector</h1>
      <p class="note">Looks up Vietnamese meaning, IPA, audio, and examples, then saves locally or syncs to your Sheet.</p>
    </header>
    <div id="list"></div>
    <footer>
      <div class="footer-row three">
        <button id="settings">Settings</button>
        <button id="syncAll">Sync all</button>
        <button id="clear">Clear local data</button>
      </div>
      <div id="status" role="status"></div>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
